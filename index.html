<style>
/* Layout: one phone-width column; sticky list header with overall progress, then a stack of line cards that expand into tickable checklists. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --fg:#16202B; --muted:#5D6B7A; --line:#DCE2E9;
  --accent:#2952D9; --accent-soft:#E6ECFD; --done:#17885C; --done-soft:#E1F3EA; --over:#B26A00; --over-soft:#FBEFD9; --warn:#C2410C;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Inter", -apple-system, system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151C; --surface:#18212B; --fg:#E7EDF3; --muted:#93A1AF; --line:#2A3542;
  --accent:#7D9BFF; --accent-soft:#1F2A4A; --done:#4CC793; --done-soft:#143327; --over:#F0A93B; --over-soft:#3A2A10; --warn:#FB923C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151C; --surface:#18212B; --fg:#E7EDF3; --muted:#93A1AF; --line:#2A3542;
  --accent:#7D9BFF; --accent-soft:#1F2A4A; --done:#4CC793; --done-soft:#143327; --over:#F0A93B; --over-soft:#3A2A10; --warn:#FB923C; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{padding-block:12px 10px;display:grid;gap:10px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.brand{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.listpick{flex:1;min-width:0;appearance:none;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 34px 9px 12px;font-family:var(--display);font-weight:600;font-size:17px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;text-overflow:ellipsis}
.iconbtn{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:10px;height:42px;padding:0 12px;font-weight:600;font-size:14px}
.iconbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.summary{display:flex;align-items:center;gap:12px}
.ring{flex:none;width:52px;height:52px}
.ring circle{fill:none;stroke-width:6}
.ring .trk{stroke:var(--line)} .ring .val{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring.full .val{stroke:var(--done)}
.ring text{font:600 12px var(--body);fill:var(--fg)}
.sumtxt{min-width:0}
.sumtxt b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.sumtxt small{display:block;color:var(--muted);font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.status{font-size:12px;color:var(--muted)}
main .wrap{padding-block:14px 40px;display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card.done{border-color:color-mix(in srgb,var(--done) 45%,var(--line))}
.card.over{border-color:color-mix(in srgb,var(--over) 50%,var(--line))}
.head{width:100%;display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;background:none;border:0;padding:14px 14px 12px}
.eyebrow{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.title{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.2;min-width:0}
.count{grid-row:1/3;grid-column:2;align-self:center;text-align:right;font-variant-numeric:tabular-nums}
.count b{font-family:var(--display);font-size:22px}
.count span{color:var(--muted);font-size:14px}
.count em{display:block;font-style:normal;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.done .count em{color:var(--done)} .over .count em{color:var(--over)} .todo .count em{color:var(--muted)}
.segs{grid-column:1/3;display:flex;gap:3px;margin-top:8px}
.segs i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.segs i.on{background:var(--accent)} .done .segs i.on{background:var(--done)} .over .segs i.on{background:var(--over)}
.badges{grid-column:1/3;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.badge{font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;background:var(--bg);color:var(--muted)}
.badge.req{background:var(--accent-soft);color:var(--accent)}
.badge.earlier{background:var(--over-soft);color:var(--over)}
.body{border-top:1px solid var(--line);padding:12px 14px 14px;display:grid;gap:12px}
.meta{display:grid;gap:6px;font-size:13.5px;color:var(--muted)}
.meta p{margin:0} .meta b{color:var(--fg);font-weight:600}
.overnote{font-size:13px;background:var(--over-soft);color:var(--over);border-radius:8px;padding:8px 10px}
.donenote{font-size:13px;background:var(--done-soft);color:var(--done);border-radius:8px;padding:8px 10px}
.ckl{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.ck{display:flex;align-items:flex-start;gap:10px;padding:9px 6px;border-radius:10px}
.ck:hover{background:var(--bg)}
.ck input{appearance:none;flex:none;width:24px;height:24px;margin:0;border:2px solid var(--line);border-radius:7px;display:grid;place-content:center;background:var(--surface)}
.ck input::after{content:"";width:12px;height:7px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.ck input:checked{background:var(--done);border-color:var(--done)} .ck input:checked::after{opacity:1}
.ck label{flex:1;min-width:0;padding-top:1px;overflow-wrap:anywhere}
.ck.on label{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.ck .x{flex:none;border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px}
.sect{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:4px 0 0}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg)}
.addrow button{border:0;border-radius:10px;padding:0 14px;background:var(--accent);color:#fff;font-weight:600}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty h2{margin:0;font-family:var(--display);color:var(--fg);font-size:20px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgb(10 15 20 / .45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.sheet h2{margin:0;font-family:var(--display);font-size:21px}
.sheet p{margin:0;color:var(--muted);font-size:13.5px}
.sheet label.f{display:grid;gap:5px;font-size:13px;font-weight:600}
.sheet input[type=text],.sheet textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);width:100%}
.sheet textarea{min-height:160px;font-size:13.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.4}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{background:var(--warn);border-color:var(--warn);color:#fff}
.btn[disabled]{opacity:.5;cursor:default}
.preview{border:1px solid var(--line);border-radius:10px;max-height:220px;overflow:auto;font-size:13px}
.preview table{border-collapse:collapse;width:100%}
.preview td,.preview th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.preview th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);position:sticky;top:0;background:var(--surface)}
.preview td.n{text-align:right;font-variant-numeric:tabular-nums}
.tag{font-size:11px;color:var(--done);font-weight:600}
.tag.no{color:var(--muted)}
.mgmt{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="row"><span class="brand">Shot List</span><span class="status" id="status"></span></div>
    <div class="row">
      <select class="listpick" id="listpick" aria-label="Task list"></select>
      <button class="iconbtn" id="managebtn" aria-label="Manage this list" title="Manage this list">•••</button>
      <button class="iconbtn primary" id="newbtn">+ New</button>

    <div class="summary" id="summary" hidden>

        <circle class="trk" cx="26" cy="26" r="22"/><circle class="val" id="ringval" cx="26" cy="26" r="22" transform="rotate(-90 26 26)" stroke-dasharray="138.2" stroke-dashoffset="138.2"/>
        <text x="26" y="30" text-anchor="middle" id="ringpct">0%</text>
      </svg>
      <div class="sumtxt"><b id="sumcount">0 / 0</b><small id="sumsub">photos taken</small></div>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filter">
      <button class="chip" data-f="all" aria-pressed="true">All</button>
      <button class="chip" data-f="todo" aria-pressed="false">Still to do</button>
      <button class="chip" data-f="done" aria-pressed="false">Complete</button>
      <button class="chip" data-f="over" aria-pressed="false">Over target</button>
    </div>
  </div>
</header>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, ' ').trim();
const slug = s => norm(s).replace(/ /g, '-').slice(0, 40) || 'item';
const TAXMAP = new Map(); TAX.forEach(t => { TAXMAP.set(norm(t[0]) + '|' + norm(t[1]), t); if (!TAXMAP.has('|' + norm(t[1]))) TAXMAP.set('|' + norm(t[1]), t); });
const taxFor = (cat, sub) => TAXMAP.get(norm(cat) + '|' + norm(sub)) || TAXMAP.get('|' + norm(sub));

/* ---------- storage: claude db when available, else this device ---------- */
const LS_KEY = 'shotlist.v1';
const Local = {
  read() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {lists:{}, progress:{}}; } catch (e) { return {lists:{}, progress:{}}; } },
  write(d) { try { localStorage.setItem(LS_KEY, JSON.stringify(d)); } catch (e) {} },
};
const Store = {
  mode: 'none', db: null, listsCb: null, progCb: null, progUnsub: null, queues: {},
  async init() {
    let db = null;
    if (db) { this.db = db; this.mode = 'db'; } else { this.mode = 'local'; }
  },
  watchLists(cb) {
    this.listsCb = cb;
    if (this.mode === 'local') { const d = Local.read(); cb(Object.entries(d.lists).map(([id, v]) => ({id, ...v})), true); return; }
    const timer = setTimeout(() => setStatus("Can't reach saved lists yet - showing what's loaded", true), 10000);
    this.db.collection('lists').onSnapshot(s => {
      if (!s.metadata.fromCache) { clearTimeout(timer); setStatus(''); }
      cb(s.docs.map(d => ({id: d.id, ...d.data()})), !s.metadata.fromCache);
    }, e => { clearTimeout(timer); setStatus('Saved lists unavailable (' + e.code + ')', true); cb([], true); });
  },
  watchProgress(listId, cb) {
    if (this.progUnsub) { this.progUnsub(); this.progUnsub = null; }
    this.progCb = cb;
    if (!listId) { cb({}); return; }
    if (this.mode === 'local') { const d = Local.read(); cb(d.progress[listId] || {}); return; }
    this.progUnsub = this.db.collection('progress').where('listId', '==', listId).onSnapshot(s => {
      const m = {}; s.docs.forEach(d => { const v = d.data(); m[v.lineId] = v; }); cb(m);
    }, e => setStatus('Ticks unavailable (' + e.code + ')', true));
  },
  queue(key, fn) { const p = (this.queues[key] || Promise.resolve()).then(fn, fn); this.queues[key] = p.catch(() => {}); return p; },
  async saveList(id, body) {
    if (this.mode === 'local') { const d = Local.read(); d.lists[id] = body; Local.write(d); this.watchLists(this.listsCb); return; }
    return this.queue('lists/' + id, () => this.db.doc('lists/' + id).set(body));
  },
  async deleteList(id, lineIds) {
    if (this.mode === 'local') { const d = Local.read(); delete d.lists[id]; delete d.progress[id]; Local.write(d); this.watchLists(this.listsCb); return; }
    await this.queue('lists/' + id, () => this.db.doc('lists/' + id).delete());
    for (const l of lineIds) await this.queue('p/' + id + l, () => this.db.doc('progress/' + id + '__' + l).delete());
  },
  async saveProgress(listId, lineId, body) {
    const full = {listId, lineId, ...body};
    if (this.mode === 'local') { const d = Local.read(); (d.progress[listId] ||= {})[lineId] = full; Local.write(d); this.progCb && this.progCb(d.progress[listId]); return; }
    return this.queue('p/' + listId + lineId, () => this.db.doc('progress/' + listId + '__' + lineId).set(full));
  },
};

/* ---------- state ---------- */
const S = { lists: [], listId: null, progress: {}, filter: 'all', open: new Set(), loaded: false };
try { const p = JSON.parse(localStorage.getItem('shotlist.ui') || '{}'); S.listId = p.listId || null; S.filter = p.filter || 'all'; (p.open || []).forEach(x => S.open.add(x)); } catch (e) {}
const saveUi = () => { try { localStorage.setItem('shotlist.ui', JSON.stringify({listId: S.listId, filter: S.filter, open: [...S.open].slice(-40)})); } catch (e) {} };
const curList = () => S.lists.find(l => l.id === S.listId);
function lineCount(line) {
  const p = S.progress[line.id] || {}; const t = (p.ticked || []).filter(x => (line.ideas || []).includes(x)).length;
  return t + (p.custom || []).filter(c => c.done).length;
}
function lineState(line) { const n = lineCount(line); return n > line.req ? 'over' : n === line.req ? 'done' : 'todo'; }

function setStatus(t, warn) { const el = $('#status'); el.textContent = t; el.style.color = warn ? 'var(--warn)' : ''; }
let toastT; function toast(t) { let el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); } el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2200); }

/* ---------- render ---------- */
function renderPicker() {
  const sel = $('#listpick');
  const lists = [...S.lists].sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
  sel.innerHTML = lists.length ? lists.map(l => `<option value="${esc(l.id)}">${esc(l.name)}</option>`).join('') : '<option value="">No lists yet</option>';
  sel.disabled = !lists.length; $('#managebtn').disabled = !lists.length;
  if (S.listId) sel.value = S.listId;
}
function renderSummary() {
  const l = curList(); const box = $('#summary');
  if (!l) { box.hidden = true; return; }
  box.hidden = false;
  const req = l.lines.reduce((a, x) => a + x.req, 0);
  const got = l.lines.reduce((a, x) => a + Math.min(lineCount(x), x.req), 0);
  const extra = l.lines.reduce((a, x) => a + Math.max(lineCount(x) - x.req, 0), 0);
  const doneLines = l.lines.filter(x => lineCount(x) >= x.req).length;
  const pct = req ? Math.round(got / req * 100) : 0;
  $('#ringval').setAttribute('stroke-dashoffset', (138.2 * (1 - pct / 100)).toFixed(1));
  $('#ring').classList.toggle('full', pct === 100);
  $('#ringpct').textContent = pct + '%';
  $('#sumcount').textContent = `${got} / ${req}`;
  $('#sumsub').textContent = `${doneLines} of ${l.lines.length} lines complete` + (extra ? ` · ${extra} extra to drop` : '');
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.f === S.filter)));
}
function cardHtml(line) {
  const n = lineCount(line), st = lineState(line), open = S.open.has(S.listId + '/' + line.id);
  const segs = line.req <= 12 ? `<div class="segs" aria-hidden="true">${Array.from({length: line.req}, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</div>`
    : `<div class="segs" aria-hidden="true"><i class="on" style="flex:${Math.min(n, line.req)}"></i><i style="flex:${Math.max(line.req - n, 0)}"></i></div>`;
  const label = st === 'done' ? 'Complete' : st === 'over' ? `${n - line.req} over` : `${line.req - n} to go`;
  const urlB = line.url ? `<span class="badge ${/^req/i.test(line.url) ? 'req' : ''}">URL ${esc(line.url.toLowerCase())}</span>` : '';
  const earl = line.earlier ? `<span class="badge earlier">Done before</span>` : '';
  let body = '';
  if (open) {
    const p = S.progress[line.id] || {}; const ticked = new Set(p.ticked || []);
    const meta = [line.desc && `<p><b>What:</b> ${esc(line.desc)}</p>`, line.examples && `<p><b>Examples:</b> ${esc(line.examples)}</p>`,
      line.where && `<p><b>Where:</b> ${esc(line.where)}</p>`, line.notes && `<p><b>Notes:</b> ${esc(line.notes)}</p>`,
      line.earlier && `<p><b>Earlier batches:</b> ${esc(line.earlier)}</p>`].filter(Boolean).join('');
    const ideas = (line.ideas || []).map((t, i) => {
      const id = `ck-${line.id}-${i}`; const on = ticked.has(t);
      return `<li class="ck ${on ? 'on' : ''}"><input type="checkbox" id="${id}" data-act="idea" data-line="${esc(line.id)}" data-i="${i}" ${on ? 'checked' : ''}><label for="${id}">${esc(t)}</label></li>`;
    }).join('');
    const custom = (p.custom || []).map((c, i) => {
      const id = `cc-${line.id}-${i}`;
      return `<li class="ck ${c.done ? 'on' : ''}"><input type="checkbox" id="${id}" data-act="custom" data-line="${esc(line.id)}" data-i="${i}" ${c.done ? 'checked' : ''}><label for="${id}">${esc(c.text)}</label><button class="x" data-act="rmcustom" data-line="${esc(line.id)}" data-i="${i}" aria-label="Remove ${esc(c.text)}">×</button></li>`;
    }).join('');
    const note = st === 'over' ? `<div class="overnote">You have ${n} for a limit of ${line.req}. Submit only your best ${line.req}.</div>`
      : st === 'done' ? `<div class="donenote">All ${line.req} done for this line.</div>` : '';
    body = `<div class="body">${meta ? `<div class="meta">${meta}</div>` : ''}${note}
      ${ideas ? `<p class="sect">Ideas - tick each one you shoot</p><ul class="ckl">${ideas}</ul>` : ''}
      <p class="sect">Your own items</p>${custom ? `<ul class="ckl">${custom}</ul>` : ''}
      <form class="addrow" data-act="add" data-line="${esc(line.id)}"><input id="add-${esc(line.id)}" placeholder="Add something you shot, e.g. IMG_6901 tape measure" aria-label="Add your own item" autocomplete="off"><button>Add</button></form></div>`;
  }
  return `<section class="card ${st}" data-line="${esc(line.id)}">
    <button class="head" data-act="toggle" data-line="${esc(line.id)}" aria-expanded="${open}">
      <span class="eyebrow">${esc(line.cat || '')}</span>
      <span class="count"><b>${n}</b><span> / ${line.req}</span><em>${label}</em></span>
      <span class="title">${esc(line.sub)}</span>${segs}
      ${urlB || earl ? `<span class="badges">${urlB}${earl}</span>` : ''}
    </button>${body}</section>`;
}
function renderCards() {
  const box = $('#cards'); const l = curList();
  if (!S.loaded) return;
  if (!l) {
    box.innerHTML = `<div class="empty"><h2>No task lists yet</h2><p>Add one by pasting from your Excel task list, or paste the Category / Subcategory / Up To list you receive.</p><div class="btns" style="justify-content:center"><button class="btn primary" data-act="new">+ New list</button><button class="btn" data-act="backup">Restore from backup</button></div></div>`;
    return;
  }
  const lines = l.lines.filter(x => S.filter === 'all' || lineState(x) === S.filter || (S.filter === 'todo' && lineState(x) === 'todo'));
  box.innerHTML = lines.length ? lines.map(cardHtml).join('') : `<div class="empty"><p>Nothing here for this filter.</p></div>`;
}
function render() { renderPicker(); renderSummary(); renderCards(); }

/* ---------- actions ---------- */
function writeLine(line, mut) {
  const p = S.progress[line.id] || {}; const next = {ticked: [...(p.ticked || [])], custom: (p.custom || []).map(c => ({...c}))};
  mut(next); S.progress[line.id] = {listId: S.listId, lineId: line.id, ...next};
  render();
  Store.saveProgress(S.listId, line.id, next).catch(e => toast(e && e.code === 'quota_exceeded' ? 'Storage is full - delete an old list' : "Couldn't save - check your connection"));
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act; const l = curList();
  const line = l && l.lines.find(x => x.id === t.dataset.line);
  if (act === 'toggle') { const k = S.listId + '/' + line.id; S.open.has(k) ? S.open.delete(k) : S.open.add(k); saveUi(); renderCards(); }
  else if (act === 'idea') { const txt = line.ideas[+t.dataset.i]; writeLine(line, p => { const s = new Set(p.ticked); t.checked ? s.add(txt) : s.delete(txt); p.ticked = [...s]; }); }
  else if (act === 'custom') { writeLine(line, p => { p.custom[+t.dataset.i].done = t.checked; }); }
  else if (act === 'rmcustom') { writeLine(line, p => { p.custom.splice(+t.dataset.i, 1); }); }
  else if (act === 'new') openImport();
  else if (act === 'backup') openBackup();
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-act="add"]'); if (!f) return; e.preventDefault();
  const inp = f.querySelector('input'); const v = inp.value.trim(); if (!v) return;
  const line = curList().lines.find(x => x.id === f.dataset.line);
  writeLine(line, p => p.custom.push({text: v.slice(0, 200), done: true}));
  setTimeout(() => { const i = document.getElementById('add-' + line.id); i && i.focus(); }, 0);
